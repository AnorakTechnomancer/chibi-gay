<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Chibi Gay</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      background: #000 url("./image.png") center center / cover no-repeat;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #error {
      display: none; position: fixed; bottom: 12px; left: 12px; right: 12px;
      background: #1b1b1b; color: white; font: 14px system-ui, sans-serif;
      padding: 12px; border-radius: 8px; text-align: center;
    }
  </style>
</head>
<body>
  <audio id="sound" src="./sound.mp3" preload="auto"></audio>
  <div id="error" role="status"></div>
  <script>
    const sound = document.getElementById("sound");
    const error = document.getElementById("error");
    function playSound() {
      error.style.display = "none";
      try {
        sound.pause();
        sound.currentTime = 0;
        sound.muted = false;
        sound.volume = 1;
        const playback = sound.play();
        if (playback) playback.catch(err => {
          console.error("Sound playback failed:", err);
          error.textContent = "Sound couldn't play: " + err.message;
          error.style.display = "block";
        });
      } catch (err) {
        console.error("Sound playback failed:", err);
        error.textContent = "Sound couldn't play: " + err.message;
        error.style.display = "block";
      }
    }
    document.addEventListener("pointerdown", playSound);
    document.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") playSound();
    });
  </script>
</body>
</html>
